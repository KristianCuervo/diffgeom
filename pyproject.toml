[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffgeom"
version = "0.1.0"
description = "Symbolic Riemannian geometry on top of SymPy: curvature tensors, geodesics, Killing fields and induced metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kristian Cuervo", email = "kristiancuervo12@gmail.com" }]
keywords = ["differential-geometry", "riemannian-geometry", "sympy", "symbolic-computation", "tensor-calculus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.13",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/KristianCuervo/differentialGeometry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
